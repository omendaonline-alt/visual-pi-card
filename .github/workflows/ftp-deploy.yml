name: Deploy Website to Nginx

on:
  push:
    branches:
      - main
      - omendaonline-alt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nginx-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      WEB_ROOT: ${{ secrets.NGINX_WEB_ROOT }}

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Validate configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          for variable in SSH_HOST SSH_PORT SSH_USER WEB_ROOT SSH_PRIVATE_KEY; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing production secret: $variable"
              exit 1
            fi
          done

          case "$WEB_ROOT" in
            /var/www/*) ;;
            *)
              echo "::error::NGINX_WEB_ROOT must be under /var/www/"
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify server
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$WEB_ROOT' && test -w '$WEB_ROOT'"

      - name: Deploy website
        run: |
          rsync --archive --compress --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='README.md' \
            --exclude='package-lock.json' \
            --exclude='deploy.ps1' \
            --exclude='git-deploy.ps1' \
            --exclude='Pi network visual card/' \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$WEB_ROOT/"

      - name: Report deployment
        run: |
          echo "### Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "https://omendapipaysglobel.online" >> "$GITHUB_STEP_SUMMARY"
