name: Deploy to VPS

on:
  push:
    branches:
      - main
      - omendaonline-alt

jobs:
  ssh-deploy:
    name: Deploy to omendapipaysglobel.online
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy files
        run: |
          mkdir -p deploy
          rsync -av \
            --exclude '.git*' \
            --exclude '.github*' \
            --exclude 'node_modules*' \
            --exclude 'package-lock.json' \
            --exclude '.vscode*' \
            --exclude 'README.md' \
            --exclude 'deploy.ps1' \
            --exclude 'git-deploy.ps1' \
            --exclude 'deploy.sh' \
            --exclude 'deploy.zip' \
            --exclude '.env*' \
            --exclude 'ecosystem.config.js' \
            --exclude 'data/**' \
            --exclude 'uploads/**' \
            ./ deploy/

      - name: Deploy site via SSH
        uses: appleboy/scp-action@v1
        with:
          host: omendapipaysglobel.online
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: deploy/*
          target: /var/www/pivisualcard
          strip_components: 1
          overwrite: true

      - name: Fix ownership and restart app
        uses: appleboy/ssh-action@v1
        with:
          host: omendapipaysglobel.online
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            chown -R www-data:www-data /var/www/pivisualcard
            pm2 restart pivisualcard --update-env || true
