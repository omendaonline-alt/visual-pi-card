<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Product - Omenda Pi Pays Global</title>
  <link rel="icon" type="image/svg+xml" href="icon-192.svg">
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f8fafc;color:#111827}
    header{padding:18px 20px;background:#1e1245;color:#fff;display:flex;justify-content:space-between;gap:14px;align-items:center}
    header a{color:#f8d866;text-decoration:none;font-weight:800}
    main{max-width:680px;margin:24px auto;padding:0 16px}
    form{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:18px;display:grid;gap:12px;box-shadow:0 14px 40px rgba(15,23,42,.08)}
    label{font-weight:800;font-size:.9rem}
    input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;padding:11px;font:inherit}
    button{border:0;border-radius:8px;padding:12px 16px;background:#c0392b;color:#fff;font-weight:900;cursor:pointer}
    .msg{margin-top:14px;padding:12px;border-radius:8px;background:#ecfdf5;color:#166534;display:none}
    #imagePreview{display:none;width:100%;max-height:280px;object-fit:cover;border-radius:8px}
  </style>
</head>
<body>
  <header><strong>Post Product</strong><a href="shop.html">Back to Marketplace</a></header>
  <main>
    <form id="productForm">
      <label>Product name<input id="title" required placeholder="Example: Solar charger"></label>
      <label>Brand or seller name<input id="brand" required placeholder="Example: Omenda Solar"></label>
      <label>Price in Pi<input id="price" required placeholder="0.001"></label>
      <label>Category<select id="category"><option>Electronics</option><option>Fashion</option><option>Home & Garden</option><option>Cars</option><option>Aircraft</option><option>Real Estate</option></select></label>
      <label id="aircraftTypeField" hidden>Aircraft type<select id="aircraftType"><option>Single engine</option><option>Trainer</option><option>Bush plane</option><option>Ultralight</option><option>Helicopter</option><option>Business aircraft</option><option>Other</option></select></label>
      <div id="aircraftDetails" hidden>
        <label>Aircraft manufacturer<input id="aircraftManufacturer" placeholder="Example: Cessna / Textron Aviation"></label>
        <label>Engine capacity<input id="aircraftEngine" placeholder="Example: Lycoming IO-360 · 180 hp"></label>
        <label>Seats<input id="aircraftSeats" placeholder="Example: 4 seats"></label>
        <label>Model year<input id="aircraftYear" placeholder="Example: 2020"></label>
        <label>Range<input id="aircraftRange" placeholder="Example: 1,185 km"></label>
        <label>Seller location<input id="aircraftLocation" placeholder="City, Country"></label>
      </div>
      <label>Product images<input id="productImage" type="file" accept="image/png,image/jpeg,image/webp" multiple required></label>
      <img id="imagePreview" alt="Selected product image preview">
      <label>Description<textarea id="description" rows="4" placeholder="Describe your product"></textarea></label>
      <button type="submit">Save Product Locally</button>
    </form>
    <div class="msg" id="msg">Product saved. Open Marketplace to share it on Social.</div>
  </main>
  <script>
    var imageInput=document.getElementById('productImage');
    var imagePreview=document.getElementById('imagePreview');
    var categoryInput=document.getElementById('category');
    var aircraftTypeField=document.getElementById('aircraftTypeField');
    var aircraftDetails=document.getElementById('aircraftDetails');
    function updateCategoryFields(){var aircraft=categoryInput.value==='Aircraft';aircraftTypeField.hidden=!aircraft;aircraftDetails.hidden=!aircraft}
    categoryInput.onchange=updateCategoryFields;
    var requestedCategory=new URLSearchParams(window.location.search).get('category');
    if(requestedCategory&&Array.prototype.some.call(categoryInput.options,function(option){return option.value===requestedCategory}))categoryInput.value=requestedCategory;
    updateCategoryFields();
    imageInput.onchange=function(){
      var file=this.files&&this.files[0];
      if(!file){imagePreview.style.display='none';imagePreview.removeAttribute('src');return;}
      imagePreview.src=URL.createObjectURL(file);
      imagePreview.style.display='block';
    };
    function imageDataUrl(file){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve(String(reader.result||''))};reader.onerror=reject;reader.readAsDataURL(file)})}
    document.getElementById('productForm').onsubmit=async function(e){
      e.preventDefault();
      var files=Array.prototype.slice.call(imageInput.files||[]);
      if(!files.length||files.length>5||files.some(function(file){return file.size>4*1024*1024})){alert('Choose up to 5 product images, each up to 4MB.');return;}
      var rows=[];
      try{rows=JSON.parse(localStorage.getItem('omendaSellerProducts')||'[]')}catch(err){}
      var images=await Promise.all(files.map(imageDataUrl));
      var aircraft=categoryInput.value==='Aircraft';
      rows.unshift({title:document.getElementById('title').value.trim(),brand:document.getElementById('brand').value.trim(),price:document.getElementById('price').value.trim(),category:categoryInput.value,aircraftType:aircraft?document.getElementById('aircraftType').value:'',manufacturer:aircraft?document.getElementById('aircraftManufacturer').value.trim():'',engine:aircraft?document.getElementById('aircraftEngine').value.trim():'',seats:aircraft?document.getElementById('aircraftSeats').value.trim():'',year:aircraft?document.getElementById('aircraftYear').value.trim():'',range:aircraft?document.getElementById('aircraftRange').value.trim():'',location:aircraft?document.getElementById('aircraftLocation').value.trim():'',description:document.getElementById('description').value.trim(),image:images[0],images:images,createdAt:new Date().toISOString()});
      localStorage.setItem('omendaSellerProducts',JSON.stringify(rows.slice(0,50)));
      document.getElementById('msg').style.display='block';
      this.reset();
      updateCategoryFields();
      imagePreview.style.display='none';imagePreview.removeAttribute('src');
    };
  </script>
</body>
</html>
